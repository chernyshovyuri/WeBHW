[project]
name = "webhm"
version = "0.1.0"
description = "Тут будет храпеть ДЗ по WeB"
readme = "README.md"
authors = [
    { name = "Yrii Chernyshov", email = "c300@list.ru" }
]
requires-python = ">=3.15"
dependencies = [
    "coloredstrings>=3.3.0",
    "fastapi[all]>=0.142.2",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "sqlmodel>=0.0.48",
]

[project.scripts]
webhm = "webhm:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
 